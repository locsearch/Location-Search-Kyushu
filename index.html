<style>
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
h1 { font-size: 1.2rem; text-align: center; margin-top: 5px; margin-bottom: 15px; }

/* 検索バーと音声ボタンの横並び配置 */
.search-wrapper {
display: flex;
gap: 8px;
}
.search-box {
flex: 1;
padding: 12px;
font-size: 1.1rem;
border: 2px solid #007aff;
border-radius: 8px;
outline: none;
text-transform: uppercase;
}
.voice-btn {
width: 50px;
background: #007aff;
color: white;
border: none;
border-radius: 8px;
font-size: 1.3rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}
.voice-btn.listening {
background: #e63946; /* 聞き取り中は赤く点滅 */
animation: pulse 1s infinite alternate;
}
@keyframes pulse {
from { transform: scale(1); }
to { transform: scale(1.08); }
}

.result-card {
margin-top: 15px;
padding: 15px;
background: #fff;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
text-align: center;
display: none;
}
.result-item { font-size: 0.9rem; color: #666; }
.result-shelf { font-size: 1.8rem; font-weight: bold; color: #e63946; margin-top: 5px; }

.list {
margin-top: 15px;
background: #fff;
border-radius: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
max-height: 50vh;
overflow-y: auto;
list-style: none;
padding: 0;
}
.list li {
padding: 12px 15px;
border-bottom: 1px solid #eee;
display: flex;
justify-content: space-between;
cursor: pointer;
}
.list li:active { background-color: #eef5ff; }
.list li .code { font-weight: bold; }
.list li .shelf { color: #007aff; font-weight: bold; }
</style>
</head>

const input = document.getElementById('searchInput');
const voiceBtn = document.getElementById('voiceBtn');
const list = document.getElementById('candidateList');
const resultCard = document.getElementById('resultCard');
const selectedCode = document.getElementById('selectedCode');
const selectedShelf = document.getElementById('selectedShelf');

// 検索処理（前方一致）
function performSearch() {
const query = input.value.trim().toUpperCase();
list.innerHTML = '';
resultCard.style.display = 'none';

if (!query) return;

const filtered = masterData.filter(item => item.code.toUpperCase().startsWith(query));

filtered.forEach(item => {
const li = document.createElement('li');
li.innerHTML = `<span class="code">${item.code}</span><span class="shelf">${item.shelf}</span>`;
li.onclick = () => selectItem(item);
list.appendChild(li);
});
}

input.addEventListener('input', performSearch);

function selectItem(item) {
input.value = item.code;
list.innerHTML = '';
selectedCode.textContent = "品番: " + item.code;
selectedShelf.textContent = item.shelf;
resultCard.style.display = 'block';
}

// --- 音声認識の処理 (Web Speech API) ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
const recognition = new SpeechRecognition();
recognition.lang = 'ja-JP';
recognition.interimResults = false;

voiceBtn.addEventListener('click', () => {
try {
recognition.start();
voiceBtn.classList.add('listening');
} catch (e) {
recognition.stop();
voiceBtn.classList.remove('listening');
}
});

recognition.onresult = (event) => {
let transcript = event.results[0][0].transcript;
// スペースを消して半角大文字化
transcript = transcript.replace(/\s+/g, '').toUpperCase();
input.value = transcript;
performSearch();
};

recognition.onspeechend = () => {
  recognition.stop();
};

recognition.onerror = () => {
  voiceBtn.classList.remove('listening');
  voiceBtn.textContent = '🎙';
};

recognition.onend = () => {
  voiceBtn.classList.remove('listening');
  voiceBtn.textContent = '🎙';
};
} else {
// 非対応ブラウザの場合はボタンを隠す
voiceBtn.style.display = 'none';
}
</script>
